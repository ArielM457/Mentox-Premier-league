services:
  mentox-integration:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.integration
    environment:
      EVENT_TRANSPORT: ${EVENT_TRANSPORT:-memory}
      EVENT_PRODUCER: ${EVENT_PRODUCER:-synthetic-generator}
      EVENT_HUB_FULLY_QUALIFIED_NAMESPACE: ${EVENT_HUB_FULLY_QUALIFIED_NAMESPACE:-}
      EVENT_HUB_NAME: ${EVENT_HUB_NAME:-}
      EVENT_HUB_CONSUMER_GROUP: ${EVENT_HUB_CONSUMER_GROUP:-}
      VISION_OBSERVATION_TRANSPORT: ${VISION_OBSERVATION_TRANSPORT:-memory}
      VISION_EVENT_HUB_NAME: ${VISION_EVENT_HUB_NAME:-vision-observations}
      VISION_EVENT_HUB_CONSUMER_GROUP: ${VISION_EVENT_HUB_CONSUMER_GROUP:-backend}
      ROBOFLOW_SUITE_ENDPOINT: ${ROBOFLOW_SUITE_ENDPOINT:-}
      ROBOFLOW_SUITE_API_KEY: ${ROBOFLOW_SUITE_API_KEY:-}
      MENTOX_MODEL_API_KEY: ${MENTOX_MODEL_API_KEY:-}
      VISION_CAPTURE_INTERVAL_MS: ${VISION_CAPTURE_INTERVAL_MS:-1000}
      SOCCERNET_ENDPOINT: ${SOCCERNET_ENDPOINT:-}
      SOCCERNET_API_KEY: ${SOCCERNET_API_KEY:-}
      SOCCERNET_TIMEOUT_SECONDS: ${SOCCERNET_TIMEOUT_SECONDS:-900}
      SOCCERNET_GAMESTATE_ENABLED: ${SOCCERNET_GAMESTATE_ENABLED:-false}
      VISION_SIMULATOR_ENABLED: ${VISION_SIMULATOR_ENABLED:-auto}
      VISION_STARTUP_MATCH_ID: ${VISION_STARTUP_MATCH_ID:-synthetic-live-001}
      SOCCERNET_GAMESTATE_ENDPOINT: ${SOCCERNET_GAMESTATE_ENDPOINT:-}
      SOCCERNET_GAMESTATE_API_KEY: ${SOCCERNET_GAMESTATE_API_KEY:-}
      SOCCERNET_GAMESTATE_TIMEOUT_SECONDS: ${SOCCERNET_GAMESTATE_TIMEOUT_SECONDS:-3600}
      SOCCERNET_GAMESTATE_POLL_SECONDS: ${SOCCERNET_GAMESTATE_POLL_SECONDS:-5}
      SOCCERNET_GAMESTATE_SAMPLE_INTERVAL_MS: ${SOCCERNET_GAMESTATE_SAMPLE_INTERVAL_MS:-1000}
      SOCCERNET_GAMESTATE_TEAM_BY_SIDE: ${SOCCERNET_GAMESTATE_TEAM_BY_SIDE:-}
      SOCCERNET_GAMESTATE_ROSTER_VERIFIED: ${SOCCERNET_GAMESTATE_ROSTER_VERIFIED:-false}
      AZURE_BLOB_SERVICE_ENDPOINT: ${AZURE_BLOB_SERVICE_ENDPOINT:-}
      VISION_VIDEO_CONTAINER: ${VISION_VIDEO_CONTAINER:-synthetic-videos}
      VISION_VIDEO_BLOB_NAME: ${VISION_VIDEO_BLOB_NAME:-}
      ROUTING_TRANSPORT: ${ROUTING_TRANSPORT:-memory}
      METRICS_EVENT_HUB_NAME: ${METRICS_EVENT_HUB_NAME:-match-metrics}
      SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE: ${SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE:-}
      IMPORTANT_EVENTS_QUEUE_NAME: ${IMPORTANT_EVENTS_QUEUE_NAME:-important-events}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      MENTOX_INTEGRATION_VIDEO: /workspace/experiments/authorized-video/input/2e57b9_0.mp4
    ports:
      - "8018:8018"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8018/api/v1/integration/live/status', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - ./experiments/authorized-video/input:/workspace/experiments/authorized-video/input:ro
      - ./experiments/roboflow-sports/output-real:/workspace/experiments/roboflow-sports/output-real:ro
      - ./experiments/soccernet-teamspotting/output-real:/workspace/experiments/soccernet-teamspotting/output-real:ro
      - ./experiments/fusion-calibration/output:/workspace/experiments/fusion-calibration/output:ro
