[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "match-intelligence-api"
version = "0.1.0"
description = "API inicial para eventos sintéticos de fútbol"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiohttp>=3.9,<4",
  "azure-eventhub>=5.12,<6",
  "azure-identity>=1.17,<2",
  "azure-storage-blob>=12.20,<13",
  "fastapi==0.115.6",
  "pydantic>=2.10,<3",
  "supabase>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
agents = ["crewai[azure-ai-inference]>=1.14,<2"]
dev = ["anyio==4.9.0", "httpx==0.28.1", "pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]
